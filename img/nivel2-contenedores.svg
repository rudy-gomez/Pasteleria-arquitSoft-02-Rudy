orta estáticamente.</text><text x="110" y="908" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#182c43" text-anchor="start">Express sirve interfaz y API bajo un mismo origen.</text><path d="M48 984H1552" stroke="#cfdae6"/><text x="48" y="1020" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="start">Azul: contenedores propios · Gris: proveedor externo · Borde: sistema · Credenciales solo en API</text></svg>
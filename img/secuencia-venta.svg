<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1520" viewBox="0 0 1800 1520" role="img" aria-label="Diagrama de secuencia · confirmar venta"><title>Diagrama de secuencia · confirmar venta</title><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#526277"/></marker><marker id="tri" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="11" markerHeight="11" orient="auto"><path d="M1 1L11 6L1 11Z" fill="white" stroke="#526277"/></marker><marker id="diamond" viewBox="0 0 14 10" refX="1" refY="5" markerWidth="12" markerHeight="9" orient="auto"><path d="M0 5L7 0L14 5L7 10Z" fill="#526277"/></marker></defs><rect width="100%" height="100%" fill="white"/><text x="48" y="55" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#182c43" text-anchor="start">Diagrama de secuencia · confirmar venta</text><text x="48" y="89" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#526277" text-anchor="start">POST /api/v1/ventas · confirmación, reintento y rollback</text><rect x="20" y="140" width="220" height="70" rx="7" fill="#eaf2fc" stroke="#235b9c" stroke-width="2"/><text x="130.0" y="182.5" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#182c43" text-anchor="middle">Aplicación web</text><polyline points="130,210 130,1410" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5"/><rect x="320" y="140" width="220" height="70" rx="7" fill="#eaf2fc" stroke="#235b9c" stroke-width="2"/><text x="430.0" y="182.5" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#182c43" text-anchor="middle">VentasController</text><polyline points="430,210 430,1410" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5"/><rect x="620" y="140" width="220" height="70" rx="7" fill="#eaf2fc" stroke="#235b9c" stroke-width="2"/><text x="730.0" y="182.5" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#182c43" text-anchor="middle">ConfirmarVenta</text><polyline points="730,210 730,1410" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5"/><rect x="950" y="140" width="220" height="70" rx="7" fill="#eaf2fc" stroke="#235b9c" stroke-width="2"/><text x="1060.0" y="182.5" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#182c43" text-anchor="middle">UnidadDeTrabajoPrisma</text><polyline points="1060,210 1060,1410" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5"/><rect x="1280" y="140" width="220" height="70" rx="7" fill="#eaf2fc" stroke="#235b9c" stroke-width="2"/><text x="1390.0" y="182.5" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#182c43" text-anchor="middle">Adaptadores (tx)</text><polyline points="1390,210 1390,1410" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5"/><rect x="1560" y="140" width="220" height="70" rx="7" fill="#eaf2fc" stroke="#235b9c" stroke-width="2"/><text x="1670.0" y="182.5" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#182c43" text-anchor="middle">PostgreSQL</text><polyline points="1670,210 1670,1410" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5"/><rect x="424" y="255" width="12" height="1120" rx="0" fill="#edf2f8" stroke="#526277" stroke-width="2"/><rect x="724" y="315" width="12" height="1000" rx="0" fill="#edf2f8" stroke="#526277" stroke-width="2"/><rect x="1054" y="365" width="12" height="900" rx="0" fill="#edf2f8" stroke="#526277" stroke-width="2"/><rect x="1384" y="515" width="12" height="680" rx="0" fill="#edf2f8" stroke="#526277" stroke-width="2"/><rect x="1664" y="410" width="12" height="835" rx="0" fill="#edf2f8" stroke="#526277" stroke-width="2"/><polyline points="137,260 423,260" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/><rect x="161.5" y="231" width="237.0" height="22" fill="white"/><text x="280.0" y="248" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">1. confirmar comando + clave</text><polyline points="437,320 723,320" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/><rect x="433.0" y="291" width="294.0" height="22" fill="white"/><text x="580.0" y="308" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">2. ejecutar(cmd, contexto autorizado)</text><polyline points="737,375 1053,375" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/><rect x="789.5" y="346" width="211.0" height="22" fill="white"/><text x="895.0" y="363" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">3. ejecutar(ctx, operación)</text><polyline points="1067,425 1663,425" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/><rect x="1139.0" y="396" width="452.0" height="22" fill="white"/><text x="1365.0" y="413" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">4. BEGIN + contexto; reclamar clave y consultar resultado</text><rect x="30" y="470" width="1740" height="810" rx="0" fill="none" stroke="#526277" stroke-width="2"/><text x="45" y="495" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#182c43" text-anchor="start">alt</text><text x="65" y="530" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#182c43" text-anchor="start">[clave nueva y datos válidos]</text><polyline points="737,575 1383,575" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/><rect x="965.5" y="546" width="189.0" height="22" fill="white"/><text x="1060.0" y="563" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">5. validar caja y cotizar</text><polyline points="1397,625 1663,625" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/><rect x="1385.0" y="596" width="290.0" height="22" fill="white"/><text x="1530.0" y="613" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">Consultas y bloqueos en el mismo tx</text><polyline points="1397,675 723,675" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="978.5" y="646" width="163.0" height="22" fill="white"/><text x="1060.0" y="663" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">Precios autorizados</text><rect x="650" y="710" width="360" height="60" rx="7" fill="#fff5df" stroke="#b48325" stroke-width="2"/><text x="668" y="736" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#182c43" text-anchor="start">Crear Venta y validar total / cobros</text><text x="668" y="759" font-family="Arial, sans-serif" font-size="16" font-weight="400" fill="#182c43" text-anchor="start">Reglas del dominio</text><polyline points="737,820 1383,820" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/><rect x="894.5" y="791" width="331.0" height="22" fill="white"/><text x="1060.0" y="808" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">6. descontar lotes; guardar venta y cobros</text><polyline points="1397,870 1663,870" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/><rect x="1361.0" y="841" width="338.0" height="22" fill="white"/><text x="1530.0" y="858" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">Guardar movimientos, auditoría y resultado</text><polyline points="1067,925 1663,925" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/><rect x="1314.5" y="896" width="101.0" height="22" fill="white"/><text x="1365.0" y="913" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">7. COMMIT</text><polyline points="1067,975 723,975" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="806.5" y="946" width="177.0" height="22" fill="white"/><text x="895.0" y="963" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">Resultado confirmado</text><polyline points="30,1005 1770,1005" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5"/><text x="65" y="1035" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#182c43" text-anchor="start">[misma clave y mismo contenido]</text><polyline points="1067,1065 1663,1065" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/><rect x="1187.0" y="1036" width="356.0" height="22" fill="white"/><text x="1365.0" y="1053" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">Finalizar transacción sin nuevos movimientos</text><polyline points="1067,1100 723,1100" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="821.0" y="1071" width="148.0" height="22" fill="white"/><text x="895.0" y="1088" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">Resultado original</text><polyline points="30,1115 1770,1115" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5"/><text x="65" y="1145" font-family="Arial, sans-serif" font-size="18" font-weight="700" fill="#182c43" text-anchor="start">[error: stock, caja o clave incompatible]</text><polyline points="1067,1195 1663,1195" fill="none" stroke="#526277" stroke-width="2" marker-end="url(#arrow)"/><rect x="1226.0" y="1166" width="278.0" height="22" fill="white"/><text x="1365.0" y="1183" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">ROLLBACK de todas las escrituras</text><polyline points="1067,1245 723,1245" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="787.0" y="1216" width="216.0" height="22" fill="white"/><text x="895.0" y="1233" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">Error de dominio / conflicto</text><polyline points="737,1330 423,1330" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="508.0" y="1301" width="144.0" height="22" fill="white"/><text x="580.0" y="1318" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">Resultado o error</text><polyline points="437,1380 123,1380" fill="none" stroke="#526277" stroke-width="2" stroke-dasharray="8 5" marker-end="url(#arrow)"/><rect x="160.5" y="1351" width="239.0" height="22" fill="white"/><text x="280.0" y="1368" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">201 confirmado / 409 conflicto</text><path d="M48 1454H1752" stroke="#cfdae6"/><text x="48" y="1490" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="start">Activación: barra vertical · Retorno: línea discontinua · Autenticación y permisos preceden al caso de uso</text></svg>
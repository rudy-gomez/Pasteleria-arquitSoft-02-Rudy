astelerías</text><rect x="120" y="450" width="420" height="140" rx="7" fill="#eaf2fc" stroke="#235b9c" stroke-width="2"/><text x="330.0" y="500.5" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#182c43" text-anchor="middle">Aplicación web de gestión</text><text x="330.0" y="532.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">[Contenedor: Next.js + TypeScript]</text><text x="330.0" y="554.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">Tailwind CSS · ejecuta en navegador</text><rect x="700" y="450" width="400" height="140" rx="7" fill="#eaf2fc" stroke="#235b9c" stroke-width="2"/><text x="900.0" y="500.5" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#182c43" text-anchor="middle">API Pastelerías</text><text x="900.0" y="532.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">[Contenedor: Node.js + Express]</text><text x="900.0" y="554.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">API REST · monolito modular</text><rect x="700" y="790" width="400" height="110" rx="7" fill="#eaf2fc" stroke="#235b9c" stroke-width="2"/><text x="900.0" y="825.5" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="#182c43" text-anchor="middle">PostgreSQL</text><text x="900.0" y="857.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">[Contenedor de datos]</text><text x="900.0" y="879.5" font-family="Arial, sans-serif" font-size="17" font-weight="400" fill="#526277" text-anchor="middle">Registros, sesiones y transacciones</text><rect x="1240" y="680" width="300" height="140" rx="7" fill="#657183" stroke="#657183" stroke-width="2"/><text x="1390.0" y="730.5" font-family="Arial, sans-serif" font-size="21" font-weight="700" fill="white" text-anchor="middle">C